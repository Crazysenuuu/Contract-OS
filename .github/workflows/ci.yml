name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "20"

jobs:
  # ===== Migration Tests =====
  migration-test:
    name: Migration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cs
          POSTGRES_PASSWORD: password
          POSTGRES_DB: contractos_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U cs; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Verify migration chain
        working-directory: backend
        run: |
          python -c "
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          
          config = Config('alembic.ini')
          script = ScriptDirectory.from_config(config)
          
          heads = script.get_heads()
          assert len(heads) == 1, f'Expected 1 head, got {len(heads)}'
          print(f'✅ Migration head: {heads[0]}')
          "

      - name: Run migration (upgrade)
        working-directory: backend
        run: |
          DATABASE_URL="postgresql+asyncpg://cs:password@localhost:5432/contractos_migration_test" \
          alembic upgrade head
          echo "✅ Migration upgrade completed"

      - name: Verify tables created
        run: |
          export PGPASSWORD=password
          TABLE_COUNT=$(psql -h localhost -U cs -d contractos_migration_test -t -A -c "
            SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';
          ")
          echo "Total tables: $TABLE_COUNT"
          if [ "$TABLE_COUNT" -lt 55 ]; then
            echo "❌ Expected at least 55 tables, got $TABLE_COUNT"
            exit 1
          fi
          echo "✅ Table count verified: $TABLE_COUNT"

      - name: Test migration rollback
        working-directory: backend
        run: |
          echo "=== Testing rollback ==="
          DATABASE_URL="postgresql+asyncpg://cs:password@localhost:5432/contractos_migration_test" \
          alembic downgrade -1
          
          echo "=== Re-upgrading ==="
          DATABASE_URL="postgresql+asyncpg://cs:password@localhost:5432/contractos_migration_test" \
          alembic upgrade head
          
          echo "✅ Rollback test completed"

      - name: Check schema drift (alembic check)
        working-directory: backend
        run: |
          # Fails the PR when the ORM models and the migrated database
          # disagree (missing columns/indexes/constraints, JSON vs JSONB
          # drift, etc.). Every new migration must leave this clean.
          DATABASE_URL="postgresql+asyncpg://cs:password@localhost:5432/contractos_migration_test" \
          alembic check
          echo "✅ No schema drift between models and migrations"

      - name: Verify autogenerated migration is empty
        working-directory: backend
        run: |
          # Belt-and-braces companion to `alembic check`: autogenerate a
          # probe revision and assert it contains no operations, then delete
          # it. Catches cases where check and autogenerate disagree.
          DATABASE_URL="postgresql+asyncpg://cs:password@localhost:5432/contractos_migration_test" \
          alembic revision --autogenerate -m "ci_drift_probe" --rev-id ci_drift_probe
          OPS=$(grep -cE '^\s*op\.(create|drop|add|alter|rename)' migrations/versions/ci_drift_probe*.py || true)
          rm migrations/versions/ci_drift_probe*.py
          if [ "$OPS" -ne 0 ]; then
            echo "❌ Autogenerate produced $OPS operation(s) — models and migrations have drifted"
            exit 1
          fi
          echo "✅ Autogenerate probe is empty (no drift)"
  # ===== Backend Tests =====
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: contractos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        env:
          # Async driver: the app's engine is async-only (asyncpg). A bare
          # postgresql:// URL would make SQLAlchemy pick the psycopg2 dialect,
          # which isn't installed.
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/contractos_test
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: testing
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend

  # ===== Frontend Tests =====
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run linting
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ===== E2E Tests =====
  # One-command validation: ./scripts/test.sh e2e boots the FastAPI backend
  # against the Postgres service container, seeds the e2e fixtures, waits for
  # health, runs the Playwright suite (which starts the Next.js dev server
  # itself and proxies /api/v1 to the backend), then stops the backend.
  # Schema is created up front via alembic; the script handles everything else.
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cs
          POSTGRES_PASSWORD: password
          POSTGRES_DB: contractos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BACKEND_URL: http://localhost:8000
      DATABASE_URL: postgresql+asyncpg://cs:password@localhost:5432/contractos_e2e
      JWT_SECRET_KEY: e2e-secret-key-for-ci
      ENVIRONMENT: testing
      # Script writes the backend log here; kept for artifact upload on failure.
      BACKEND_LOG_FILE: ${{ github.workspace }}/backend/e2e-backend.log

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U cs; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create database schema
        working-directory: backend
        run: alembic upgrade head

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests (one-command target)
        run: bash scripts/test.sh e2e

      - name: Upload backend log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-backend-log
          path: backend/e2e-backend.log
          retention-days: 7

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload Playwright failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 7

  # ===== Security Scan =====
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run security scan
        working-directory: backend
        run: |
          pip install safety bandit
          safety check -r requirements.txt
          bandit -r app/ -f json -o bandit-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: backend/bandit-report.json

  # ===== Docker Build =====
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: contractos-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: contractos-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== Deploy (Staging) =====
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [e2e-test, docker-build]
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here
          # Example: kubectl apply -f k8s/staging/

  # ===== Deploy (Production) =====
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your deployment commands here
