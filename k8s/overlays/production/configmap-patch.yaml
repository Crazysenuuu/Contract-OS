apiVersion: v1
kind: ConfigMap
metadata:
  name: contractos-config
data:
  # production is a STRICT environment: mock providers, non-https APP_BASE_URL,
  # localhost CORS, STORAGE_BACKEND!=s3 or EXPOSE_API_DOCS=true all abort boot.
  ENVIRONMENT: "production"
  APP_BASE_URL: "https://app.contractos.lk"
  CORS_ORIGINS: "https://app.contractos.lk"
  EMAIL_FROM_ADDRESS: "noreply@contractos.lk"
