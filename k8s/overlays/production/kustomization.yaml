apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: contractos-production

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

# TODO: replace with your registry + an immutable tag/SHA (never `latest`
# in production). `newName` rewrites every backend image, including the
# migration initContainer.
images:
  - name: contractos-backend
    newName: registry.example.com/contractos/backend
    newTag: production
  - name: contractos-frontend
    newName: registry.example.com/contractos/frontend
    newTag: production

patches:
  - path: configmap-patch.yaml
