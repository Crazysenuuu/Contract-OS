# Example only — NOT listed in kustomization.yaml, so plain credentials never
# get baked into a rendered manifest or committed to git. Create the real
# Secret out of band, e.g.:
#
#   kubectl -n contractos-staging create secret generic contractos-secrets \
#     --from-literal=POSTGRES_PASSWORD='…' \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://contractos:…@postgres:5432/contractos' \
#     --from-literal=JWT_SECRET_KEY='…' \
#     --from-literal=FIELD_ENCRYPTION_MASTER_KEY='…' \
#     --from-literal=EMAIL_OPT_OUT_TOKEN='…' \
#     --from-literal=DOCUMENT_TOKEN_SECRET='…' \
#     --from-literal=SENDGRID_API_KEY='…' \
#     --from-literal=S3_ACCESS_KEY_ID='…' \
#     --from-literal=S3_SECRET_ACCESS_KEY='…'
#
# Keys are env-var names because the workloads consume them via env/envFrom.
# JWT_SECRET_KEY / EMAIL_OPT_OUT_TOKEN / DOCUMENT_TOKEN_SECRET must be 32+
# non-placeholder random chars or production startup validation aborts.
# POSTGRES_PASSWORD is read only by the in-cluster Postgres StatefulSet.
apiVersion: v1
kind: Secret
metadata:
  name: contractos-secrets
  labels:
    app.kubernetes.io/part-of: contractos
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql+asyncpg://contractos:CHANGE_ME@postgres:5432/contractos"
  JWT_SECRET_KEY: "CHANGE_ME_32_PLUS_RANDOM_CHARS________"
  FIELD_ENCRYPTION_MASTER_KEY: "CHANGE_ME"
  EMAIL_OPT_OUT_TOKEN: "CHANGE_ME_32_PLUS_RANDOM_CHARS________"
  DOCUMENT_TOKEN_SECRET: "CHANGE_ME_32_PLUS_RANDOM_CHARS________"
  SENDGRID_API_KEY: "CHANGE_ME"
  S3_ACCESS_KEY_ID: "CHANGE_ME"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME"
