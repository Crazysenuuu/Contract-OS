apiVersion: apps/v1
kind: Deployment
metadata:
  name: contractos-frontend
  labels:
    app: contractos-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contractos-frontend
  template:
    metadata:
      labels:
        app: contractos-frontend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: contractos-frontend:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: contractos-config
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: contractos-frontend
  labels:
    app: contractos-frontend
spec:
  selector:
    app: contractos-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
