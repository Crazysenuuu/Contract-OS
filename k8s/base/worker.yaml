apiVersion: apps/v1
kind: Deployment
metadata:
  name: contractos-celery-worker
  labels:
    app: contractos-celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contractos-celery-worker
  template:
    metadata:
      labels:
        app: contractos-celery-worker
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker
          image: contractos-backend:latest
          command:
            ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: contractos-config
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: contractos-secrets, key: DATABASE_URL}}
            - name: JWT_SECRET_KEY
              valueFrom: {secretKeyRef: {name: contractos-secrets, key: JWT_SECRET_KEY}}
            - name: FIELD_ENCRYPTION_MASTER_KEY
              valueFrom: {secretKeyRef: {name: contractos-secrets, key: FIELD_ENCRYPTION_MASTER_KEY}}
            - name: EMAIL_OPT_OUT_TOKEN
              valueFrom: {secretKeyRef: {name: contractos-secrets, key: EMAIL_OPT_OUT_TOKEN}}
            - name: DOCUMENT_TOKEN_SECRET
              valueFrom: {secretKeyRef: {name: contractos-secrets, key: DOCUMENT_TOKEN_SECRET}}
            - name: SENDGRID_API_KEY
              valueFrom: {secretKeyRef: {name: contractos-secrets, key: SENDGRID_API_KEY}}
            - name: S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: contractos-secrets, key: S3_ACCESS_KEY_ID}}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: contractos-secrets, key: S3_SECRET_ACCESS_KEY}}
          livenessProbe:
            exec:
              command:
                ["celery", "-A", "app.worker.celery_app", "inspect", "ping", "--timeout", "10"]
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: storage
              mountPath: /app/storage
      volumes:
        - name: tmp
          emptyDir: {}
        - name: storage
          emptyDir: {}
