apiVersion: v1
kind: ConfigMap
metadata:
  name: contractos-config
  labels:
    app.kubernetes.io/part-of: contractos
data:
  # Non-secret runtime configuration shared by backend, celery and frontend.
  # Secrets (DATABASE_URL, JWT_SECRET_KEY, …) live in `contractos-secrets`.
  # Overlays patch this ConfigMap per environment (see overlays/*/configmap-patch.yaml).
  ENVIRONMENT: "production"
  APP_BASE_URL: "https://app.contractos.lk"
  CORS_ORIGINS: "https://app.contractos.lk"
  EMAIL_FROM_ADDRESS: "noreply@contractos.lk"
  EMAIL_FROM_NAME: "ContractOS"
  EMAIL_POSTAL_ADDRESS: "ContractOS (Pvt) Ltd, 121 Galle Road, Colombo 03, Sri Lanka"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  # production refuses mock providers (app.core.startup_validation).
  ESIGNATURE_PROVIDER: "docusign"
  KYC_PROVIDER: "stripe_identity"
  EMBEDDING_PROVIDER: "openai"
  # Empty = implicit AWS Textract -> Google Vision chain (not a mock).
  OCR_PROVIDER: ""
  STORAGE_BACKEND: "s3"
  S3_BUCKET: "contractos-documents"
  S3_ENDPOINT_URL: ""
  S3_REGION_NAME: "us-east-1"
  DOCUMENT_STORAGE_DIR: "/app/storage/documents"
  BACKUP_DIR: "/app/storage/backups"
  FORWARDED_HOP_COUNT: "1"
  EXPOSE_API_DOCS: "false"
  # Consumed by the Next.js server at runtime (next.config.ts rewrite target).
  BACKEND_INTERNAL_URL: "http://contractos-backend:8000"
