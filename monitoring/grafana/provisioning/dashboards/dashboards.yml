apiVersion: 1

providers:
  - name: "ContractOS Dashboards"
    orgId: 1
    folder: "ContractOS"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
